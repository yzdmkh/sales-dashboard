<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المشرف | منصة المبيعات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#4F46E5;--primary-light:#EEF2FF;--primary-dark:#4338CA;--success:#10B981;--success-light:#D1FAE5;--danger:#EF4444;--danger-light:#FEE2E2;--warning:#F59E0B;--warning-light:#FEF3C7;--gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;--gray-500:#6B7280;--gray-700:#374151;--gray-900:#111827;--shadow-md:0 4px 12px rgba(0,0,0,0.08);--shadow-lg:0 10px 30px rgba(0,0,0,0.10);--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tajawal,sans-serif;background:linear-gradient(135deg,#F9FAFB 0%,#EEF2FF 100%);min-height:100vh;color:var(--gray-900);padding:20px;direction:rtl}
.container{max-width:1200px;margin:0 auto}
.card{background:#fff;border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-md);border:1px solid var(--gray-100)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;font-weight:800;color:var(--primary);display:flex;align-items:center;gap:8px}
.logout-btn{padding:10px 16px;font-family:Tajawal,sans-serif;font-size:13px;font-weight:700;color:var(--gray-700);background:var(--gray-100);border:none;border-radius:10px;cursor:pointer;transition:all .2s}
.logout-btn:hover{background:var(--danger-light);color:var(--danger)}
.section-title{font-size:16px;font-weight:800;margin-bottom:16px;color:var(--gray-700);border-bottom:2px solid var(--gray-100);padding-bottom:8px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.section-title > span:first-child{display:flex;align-items:center;gap:8px}
.input-group{margin-bottom:0;text-align:right}
.input-group label{display:block;font-size:12px;font-weight:700;color:var(--gray-700);margin-bottom:6px}
.input-group input,.input-group select{width:100%;padding:12px;font-family:Tajawal,sans-serif;font-size:14px;font-weight:600;border:2px solid var(--gray-200);border-radius:10px;background:var(--gray-50);color:var(--gray-900)}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--primary-light)}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:12px 20px;font-family:Tajawal,sans-serif;font-size:14px;font-weight:700;color:#fff;background:var(--primary);border:none;border-radius:10px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){background:var(--primary-dark);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{padding:6px 10px;font-size:11px;border-radius:8px}
.btn-danger{background:var(--danger)}
.btn-danger:hover:not(:disabled){background:#DC2626}
.btn-success{background:var(--success)}
.btn-success:hover:not(:disabled){background:#059669}
.btn-warning{background:var(--warning)}
.btn-warning:hover:not(:disabled){background:#D97706}
.login-box{max-width:420px;margin:80px auto;text-align:center}
.login-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:8px}
.login-subtitle{font-size:14px;color:var(--gray-500);margin-bottom:24px}
.hidden{display:none !important}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--success);color:#fff;padding:14px 24px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);transition:transform .4s;z-index:9999;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}

.date-bar{display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(135deg,#EEF2FF,#F5F3FF);border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.date-bar label{font-weight:700;color:var(--gray-700);font-size:14px}
.date-bar input{padding:10px 14px;font-family:Tajawal,sans-serif;font-size:16px;font-weight:700;border:2px solid var(--gray-200);border-radius:10px;background:#fff;cursor:pointer}
.date-bar input:focus{outline:none;border-color:var(--primary)}
.date-bar .meta{font-size:12px;color:var(--gray-500);font-weight:600;margin-right:auto}

.bulk-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* جدول الكمبيوتر */
.employees-table-wrap{overflow-x:auto;margin-top:16px;border-radius:12px;border:1px solid var(--gray-200)}
.employees-table{width:100%;border-collapse:collapse;font-size:13px;min-width:950px}
.employees-table th{background:var(--gray-50);padding:14px 10px;text-align:right;font-weight:800;color:var(--gray-700);border-bottom:2px solid var(--gray-200);white-space:nowrap;font-size:12px}
.employees-table td{padding:12px 10px;border-bottom:1px solid var(--gray-100);font-weight:600;color:var(--gray-900);vertical-align:middle}
.employees-table tr:hover{background:var(--gray-50)}
.employees-table tr:last-child td{border-bottom:none}

/* حقل إدخال المبيعات في الجدول */
.sales-input-cell{display:flex;gap:4px;align-items:center}
.sales-input-cell input{width:80px;padding:6px 8px;font-family:Tajawal,sans-serif;font-size:13px;font-weight:700;border:2px solid var(--gray-200);border-radius:8px;background:#fff;text-align:center;color:var(--gray-900)}
.sales-input-cell input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.sales-input-cell input.dirty{border-color:var(--warning);background:var(--warning-light)}
.sales-input-cell input.saved{border-color:var(--success);background:var(--success-light)}
.sales-input-cell .save-one-btn{padding:6px 8px;font-size:11px;font-weight:700;border:none;border-radius:6px;background:var(--primary);color:#fff;cursor:pointer;transition:all .2s}
.sales-input-cell .save-one-btn:hover:not(:disabled){background:var(--primary-dark)}
.sales-input-cell .save-one-btn:disabled{opacity:.4;cursor:not-allowed}

/* بطاقات الجوال */
.employees-cards{display:none;flex-direction:column;gap:12px;margin-top:16px}
.emp-card{padding:16px;background:var(--gray-50);border-radius:12px;border-right:4px solid var(--primary)}
.emp-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.emp-card-name{font-size:15px;font-weight:800;color:var(--gray-900)}
.emp-card-id{font-size:11px;color:var(--gray-500);font-weight:600;margin-top:2px}
.emp-card-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.emp-card-stat{background:#fff;padding:10px;border-radius:8px}
.emp-card-stat .lbl{font-size:10px;color:var(--gray-500);font-weight:600;margin-bottom:4px}
.emp-card-stat .val{font-size:15px;font-weight:800;color:var(--gray-900)}
.emp-card-sales-input{display:flex;gap:6px;margin-bottom:12px}
.emp-card-sales-input input{flex:1;padding:10px;font-family:Tajawal,sans-serif;font-size:16px;font-weight:800;border:2px solid var(--gray-200);border-radius:8px;background:#fff;text-align:center;color:var(--gray-900)}
.emp-card-sales-input input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.emp-card-sales-input input.dirty{border-color:var(--warning);background:var(--warning-light)}
.emp-card-sales-input input.saved{border-color:var(--success);background:var(--success-light)}
.emp-card-sales-input button{padding:10px 14px;font-family:Tajawal,sans-serif;font-size:13px;font-weight:700;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer}
.emp-card-sales-input button:disabled{opacity:.4;cursor:not-allowed}
.emp-card-actions{display:flex;gap:8px}

.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:800}
.badge.active{background:var(--success-light);color:#065F46}
.badge.inactive{background:var(--danger-light);color:#991B1B}
.progress-bar{width:80px;height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.progress-fill{height:100%;background:var(--success);border-radius:3px;transition:width .3s}
.progress-fill.low{background:var(--danger)}
.progress-fill.mid{background:var(--warning)}

@media (max-width:768px){
  body{padding:12px}
  .card{padding:16px}
  .grid-3{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
  .header h1{font-size:18px}
  .employees-table-wrap{display:none}
  .employees-cards{display:flex}
  .date-bar{padding:12px}
  .date-bar label{font-size:12px}
  .date-bar input{font-size:14px;padding:8px 10px}
  .login-box{margin:40px auto}
  .login-title{font-size:22px}
  .bulk-actions{width:100%}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- شاشة تسجيل دخول المشرف -->
<div id="loginBox" class="login-box">
  <div class="card">
    <div class="login-title">🔐 لوحة المشرف</div>
    <div class="login-subtitle">أدخل كلمة المرور للوصول إلى لوحة التحكم</div>
    <div class="input-group" style="margin-bottom:16px;">
      <label>كلمة مرور المشرف</label>
      <input type="password" id="adminPass" placeholder="••••••" onkeypress="if(event.key==='Enter') loginAdmin()">
    </div>
    <button class="btn btn-block" onclick="loginAdmin()" id="loginBtn">
      <span>دخول</span>
    </button>
  </div>
</div>

<!-- لوحة التحكم -->
<div id="adminPanel" class="hidden">
  <div class="container">
    <div class="header">
      <h1>📊 لوحة إدارة المبيعات</h1>
      <button class="logout-btn" onclick="logoutAdmin()">🚪 خروج</button>
    </div>

    <!-- إضافة موظف -->
    <div class="card">
      <div class="section-title"><span>➕ إضافة موظف جديد</span></div>
      <div class="grid-3">
        <div class="input-group">
          <label>رقم الموظف</label>
          <input type="text" id="newEmpId" placeholder="EMP002">
        </div>
        <div class="input-group">
          <label>اسم الموظف</label>
          <input type="text" id="newEmpName" placeholder="سارة علي">
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="text" id="newEmpPass" placeholder="123456">
        </div>
      </div>
      <button class="btn btn-block" style="margin-top:12px;" onclick="addNewEmployee()" id="addEmpBtn">
        <span>➕ إضافة الموظف</span>
      </button>
    </div>

    <!-- قائمة الموظفين -->
    <div class="card">
      <div class="section-title">
        <span>👥 قائمة الموظفين والمبيعات</span>
        <button class="btn btn-sm btn-warning" onclick="saveAllDirty()" id="saveAllBtn" style="display:none;">
          💾 حفظ الكل
        </button>
      </div>

      <!-- شريط التاريخ -->
      <div class="date-bar">
        <label>📅 التاريخ:</label>
        <input type="date" id="filterDate" onchange="loadEmployees()">
        <span class="meta" id="dateMeta"></span>
      </div>

      <!-- جدول (كمبيوتر) -->
      <div class="employees-table-wrap">
        <table class="employees-table">
          <thead>
            <tr>
              <th>الرقم</th>
              <th>الاسم</th>
              <th>مبيعات اليوم</th>
              <th>إجمالي الشهر</th>
              <th>الهدف الشهري</th>
              <th>الإنجاز</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="employeesTableBody">
            <tr><td colspan="8" style="text-align:center;padding:24px;">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- بطاقات (جوال) -->
      <div class="employees-cards" id="employeesCards">
        <div style="text-align:center;padding:24px;color:var(--gray-500);">جاري التحميل...</div>
      </div>
    </div>

    <!-- تحديد الهدف الشهري -->
    <div class="card">
      <div class="section-title"><span>🎯 تحديد الهدف الشهري</span></div>
      <div class="grid-3">
        <div class="input-group">
          <label>الموظف</label>
          <select id="targetEmpId"></select>
        </div>
        <div class="input-group">
          <label>الشهر</label>
          <input type="month" id="targetMonth">
        </div>
        <div class="input-group">
          <label>الهدف (ريال)</label>
          <input type="number" id="targetAmount" placeholder="30000">
        </div>
      </div>
      <button class="btn btn-block" style="margin-top:12px;" onclick="saveTarget()" id="saveTargetBtn">
        <span>💾 حفظ الهدف</span>
      </button>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw1ImIxS_FCBeHLxsIT9g3Gj8aprsfLteeeSRccYgV6_coK_RWggJLVUhd4FleL4EGU/exec";
let adminPass = "";
let currentEmployees = [];
let dirtySales = {}; // {empId: amount} — المبيعات المعدّلة التي لم تُحفظ بعد

function $(id){return document.getElementById(id)}

function showToast(msg, isError, isWarning){
  var t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : (isWarning ? " warning" : ""));
  setTimeout(function(){t.classList.remove("show")}, 3500);
}

function formatNumber(num){
  var n = parseFloat(num) || 0;
  return n.toLocaleString("en-US", {minimumFractionDigits: 0, maximumFractionDigits: 2});
}

function toISODate(date){
  var y = date.getFullYear();
  var m = String(date.getMonth() + 1).padStart(2, "0");
  var d = String(date.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + d;
}

function formatMonthKey(monthKey){
  if(!monthKey) return "";
  var parts = monthKey.split("-");
  var months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var m = parseInt(parts[1]) - 1;
  return months[m] + " " + parts[0];
}

function loginAdmin(){
  var pass = $("adminPass").value.trim();
  if(!pass){showToast("أدخل كلمة المرور", true);return}
  adminPass = pass;
  $("loginBox").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
  
  $("filterDate").value = toISODate(new Date());
  
  var now = new Date();
  $("targetMonth").value = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  
  loadEmployees();
}

function logoutAdmin(){
  if(Object.keys(dirtySales).length > 0){
    if(!confirm("لديك مبيعات لم تُحفظ. هل تريد الخروج؟")) return;
  }
  adminPass = "";
  currentEmployees = [];
  dirtySales = {};
  $("adminPanel").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  $("adminPass").value = "";
}

function apiAdminCall(adminAction, extraParams){
  var body = new URLSearchParams();
  body.append("action", "admin");
  body.append("adminPass", adminPass);
  body.append("adminActionType", adminAction);
  if(extraParams){
    for(var k in extraParams){
      body.append(k, extraParams[k]);
    }
  }
  return fetch(WEB_APP_URL, {method: "POST", body: body}).then(function(r){return r.json()});
}

function loadEmployees(){
  var dateVal = $("filterDate").value;
  if(!dateVal){dateVal = toISODate(new Date());}
  
  // مسح المبيعات المعدّلة عند تغيير التاريخ
  if(Object.keys(dirtySales).length > 0){
    if(!confirm("تغيير التاريخ سيفقد المبيعات غير المحفوظة. هل تريد المتابعة؟")){
      return;
    }
    dirtySales = {};
  }
  
  $("employeesTableBody").innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;">جاري التحميل...</td></tr>';
  $("employeesCards").innerHTML = '<div style="text-align:center;padding:24px;color:var(--gray-500);">جاري التحميل...</div>';
  $("saveAllBtn").style.display = "none";
  
  apiAdminCall("getEmployees", {date: dateVal}).then(function(res){
    if(!res.success){
      showToast(res.error || "فشل التحميل", true);
      $("employeesTableBody").innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--danger);">' + (res.error || "خطأ") + '</td></tr>';
      return;
    }
    
    currentEmployees = res.employees;
    
    if(res.monthKey){
      $("dateMeta").textContent = "الشهر: " + formatMonthKey(res.monthKey);
    }
    
    renderEmployees(res.employees);
    fillTargetSelect(res.employees);
  }).catch(function(err){
    console.error(err);
    showToast("فشل الاتصال بالسيرفر", true);
    $("employeesTableBody").innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--danger);">فشل الاتصال بالسيرفر</td></tr>';
  });
}

function renderEmployees(employees){
  // ============ الجدول (كمبيوتر) ============
  var tableHtml = "";
  
  if(employees.length === 0){
    tableHtml = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--gray-500);">لا يوجد موظفون مسجلون</td></tr>';
  } else {
    employees.forEach(function(emp){
      var badgeClass = emp.status === "active" ? "active" : "inactive";
      var badgeText = emp.status === "active" ? "نشط" : "موقوف";
      var percentColor = emp.percentage >= 100 ? "success" : (emp.percentage >= 50 ? "mid" : "low");
      var percentWidth = Math.min(100, emp.percentage);
      
      var salesValue = emp.hasDaySales ? emp.daySales : "";
      var placeholder = emp.hasDaySales ? "" : "—";
      
      tableHtml += "<tr>";
      tableHtml += "<td>" + emp.id + "</td>";
      tableHtml += "<td><strong>" + emp.name + "</strong></td>";
      
      // ===== عمود مبيعات اليوم (القيمة المحفوظة + حقل الإدخال) =====
      tableHtml += "<td>";
      tableHtml += '<div style="display:flex;flex-direction:column;gap:4px;">';
      
      // 1. عرض القيمة المحفوظة
      if(emp.hasDaySales){
        tableHtml += '<span style="font-size:11px;font-weight:800;color:var(--success);">✓ ' + formatNumber(emp.daySales) + ' ريال</span>';
      } else {
        tableHtml += '<span style="font-size:11px;font-weight:600;color:var(--gray-300);">— لم تُدخل</span>';
      }
      
      // 2. حقل الإدخال + زر الحفظ
      tableHtml += '<div class="sales-input-cell">';
      tableHtml += '<input type="number" min="0" step="0.01" inputmode="decimal" ';
      tableHtml += 'data-empid="' + emp.id + '" ';
      tableHtml += 'value="' + (emp.hasDaySales ? emp.daySales : "") + '" ';
      tableHtml += 'placeholder="—" ';
      tableHtml += 'oninput="onSalesInputChange(this)" ';
      tableHtml += 'onkeypress="if(event.key===\'Enter\') saveSingleSales(\'' + emp.id + '\')">';
      tableHtml += '<button class="save-one-btn" data-savebtn="' + emp.id + '" onclick="saveSingleSales(\'' + emp.id + '\')" disabled>💾</button>';
      tableHtml += '</div>';
      
      tableHtml += '</div>';
      tableHtml += "</td>";
      // ===== نهاية عمود مبيعات اليوم =====

      tableHtml += "<td><strong>" + formatNumber(emp.monthSales) + "</strong></td>";
      tableHtml += "<td>" + (emp.monthlyTarget > 0 ? formatNumber(emp.monthlyTarget) : '<span style="color:var(--gray-300);">—</span>') + "</td>";
      tableHtml += "<td>";
      if(emp.monthlyTarget > 0){
        tableHtml += emp.percentage + "%";
        tableHtml += '<div class="progress-bar"><div class="progress-fill ' + percentColor + '" style="width:' + percentWidth + '%"></div></div>';
      } else {
        tableHtml += '<span style="color:var(--gray-300);">—</span>';
      }
      tableHtml += "</td>";
      tableHtml += "<td><span class='badge " + badgeClass + "'>" + badgeText + "</span></td>";
      tableHtml += "<td>";
      tableHtml += "<button class='btn btn-sm " + (emp.status === "active" ? "btn-danger" : "btn-success") + "' onclick='toggleStatus(\"" + emp.id + "\",\"" + emp.status + "\")' style='margin-left:4px;'>" + (emp.status === "active" ? "إيقاف" : "تنشيط") + "</button>";
      tableHtml += "<button class='btn btn-sm' onclick='resetPassword(\"" + emp.id + "\",\"" + emp.name + "\")'>🔑</button>";
      tableHtml += "</td>";
      tableHtml += "</tr>";
    });
  }
  $("employeesTableBody").innerHTML = tableHtml;
  
   // ============ البطاقات (جوال) ============
  var cardsHtml = "";
  
  if(employees.length === 0){
    cardsHtml = '<div style="text-align:center;padding:24px;color:var(--gray-500);">لا يوجد موظفون مسجلون</div>';
  } else {
    employees.forEach(function(emp){
      var badgeClass = emp.status === "active" ? "active" : "inactive";
      var badgeText = emp.status === "active" ? "نشط" : "موقوف";
      var percentColor = emp.percentage >= 100 ? "success" : (emp.percentage >= 50 ? "mid" : "low");
      var percentWidth = Math.min(100, emp.percentage);
      
      // القيمة الحالية لمبيعات اليوم
      var daySalesValue = emp.hasDaySales ? emp.daySales : null;
      var inputValue = emp.hasDaySales ? emp.daySales : "";
      var inputPlaceholder = "—";
      
      cardsHtml += '<div class="emp-card">';
      
      // رأس البطاقة
      cardsHtml += '<div class="emp-card-header">';
      cardsHtml += '<div><div class="emp-card-name">' + emp.name + '</div><div class="emp-card-id">' + emp.id + '</div></div>';
      cardsHtml += '<span class="badge ' + badgeClass + '">' + badgeText + '</span>';
      cardsHtml += '</div>';
      
      // إحصائيات الشهر
      cardsHtml += '<div class="emp-card-stats">';
      cardsHtml += '<div class="emp-card-stat"><div class="lbl">إجمالي الشهر</div><div class="val">' + formatNumber(emp.monthSales) + '</div></div>';
      cardsHtml += '<div class="emp-card-stat"><div class="lbl">الهدف الشهري</div><div class="val">' + (emp.monthlyTarget > 0 ? formatNumber(emp.monthlyTarget) : '—') + '</div></div>';
      cardsHtml += '</div>';
      
      // شريط الإنجاز
      if(emp.monthlyTarget > 0){
        cardsHtml += '<div style="font-size:11px;color:var(--gray-500);font-weight:700;margin-bottom:6px;">الإنجاز: ' + emp.percentage + '%</div>';
        cardsHtml += '<div class="progress-bar" style="width:100%;margin-bottom:12px;"><div class="progress-fill ' + percentColor + '" style="width:' + percentWidth + '%"></div></div>';
      }
      
      // ============ قسم مبيعات اليوم ============
      cardsHtml += '<div style="background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;border:2px solid var(--gray-200);">';
      
      // عرض القيمة الحالية + حقل الإدخال
      cardsHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
      cardsHtml += '<span style="font-size:11px;color:var(--gray-500);font-weight:700;">مبيعات اليوم:</span>';
      cardsHtml += '<span style="font-size:16px;font-weight:800;color:' + (daySalesValue !== null ? 'var(--gray-900)' : 'var(--gray-300)') + ';">' + (daySalesValue !== null ? formatNumber(daySalesValue) + ' ريال' : '—') + '</span>';
      cardsHtml += '</div>';
      
      // حقل الإدخال + زر الحفظ
      cardsHtml += '<div class="emp-card-sales-input">';
      cardsHtml += '<input type="number" min="0" step="0.01" inputmode="decimal" ';
      cardsHtml += 'data-empid="' + emp.id + '" ';
      cardsHtml += 'value="' + inputValue + '" ';
      cardsHtml += 'placeholder="' + inputPlaceholder + '" ';
      cardsHtml += 'oninput="onSalesInputChange(this)">';
      cardsHtml += '<button data-savebtn="' + emp.id + '" onclick="saveSingleSales(\'' + emp.id + '\')" disabled>💾</button>';
      cardsHtml += '</div>';
      
      cardsHtml += '</div>';
      
      // أزرار الإجراءات
      cardsHtml += '<div class="emp-card-actions">';
      cardsHtml += "<button class='btn btn-sm " + (emp.status === "active" ? "btn-danger" : "btn-success") + "' onclick='toggleStatus(\"" + emp.id + "\",\"" + emp.status + "\")' style='flex:1;'>" + (emp.status === "active" ? "إيقاف" : "تنشيط") + "</button>";
      cardsHtml += "<button class='btn btn-sm' onclick='resetPassword(\"" + emp.id + "\",\"" + emp.name + "\")' style='flex:1;'>🔑 كلمة المرور</button>";
      cardsHtml += '</div>';
      
      cardsHtml += '</div>';
    });
  }
  $("employeesCards").innerHTML = cardsHtml;
}

function fillTargetSelect(employees){
  var select = $("targetEmpId");
  var currentValue = select.value;
  select.innerHTML = "";
  employees.forEach(function(emp){
    var opt = document.createElement("option");
    opt.value = emp.id;
    opt.textContent = emp.id + " - " + emp.name;
    select.appendChild(opt);
  });
  if(currentValue){
    for(var i = 0; i < select.options.length; i++){
      if(select.options[i].value === currentValue){
        select.selectedIndex = i;
        break;
      }
    }
  }
}

// ============ إدخال المبيعات ============
function onSalesInputChange(input){
  var empId = input.getAttribute("data-empid");
  var value = input.value.trim();
  var originalEmp = currentEmployees.find(function(e){return e.id === empId});
  
  if(!originalEmp) return;
  
  var originalValue = originalEmp.hasDaySales ? String(originalEmp.sales) : "";
  
  // تحديث حالة الحقل
  if(value !== originalValue){
    input.classList.add("dirty");
    input.classList.remove("saved");
    dirtySales[empId] = value;
    
    // تفعيل زر الحفظ الخاص
    var saveBtn = document.querySelector('[data-savebtn="' + empId + '"]');
    if(saveBtn) saveBtn.disabled = false;
  } else {
    input.classList.remove("dirty");
    input.classList.remove("saved");
    delete dirtySales[empId];
    
    var saveBtn = document.querySelector('[data-savebtn="' + empId + '"]');
    if(saveBtn) saveBtn.disabled = true;
  }
  
  // إظهار/إخفاء زر "حفظ الكل"
  updateSaveAllButton();
}

function updateSaveAllButton(){
  var hasDirty = Object.keys(dirtySales).length > 0;
  $("saveAllBtn").style.display = hasDirty ? "inline-flex" : "none";
  if(hasDirty){
    $("saveAllBtn").textContent = "💾 حفظ الكل (" + Object.keys(dirtySales).length + ")";
  }
}

function saveSingleSales(empId){
  if(!(empId in dirtySales)) return;
  
  var dateVal = $("filterDate").value;
  var salesArray = [{empId: empId, amount: dirtySales[empId]}];
  
  var saveBtn = document.querySelector('[data-savebtn="' + empId + '"]');
  if(saveBtn){saveBtn.disabled = true; saveBtn.textContent = "⏳";}
  
  apiAdminCall("bulkSaveSales", {
    date: dateVal,
    salesJSON: JSON.stringify(salesArray)
  }).then(function(res){
    if(res.success){
      showToast("✅ " + res.message);
      delete dirtySales[empId];
      
      // تحديث حقل الإدخال
      var input = document.querySelector('input[data-empid="' + empId + '"]');
      if(input){
        input.classList.remove("dirty");
        input.classList.add("saved");
        setTimeout(function(){input.classList.remove("saved");}, 2000);
      }
      
      // إعادة تحميل البيانات (لتحديث إجمالي الشهر والإنجاز)
      setTimeout(loadEmployees, 500);
    } else {
      showToast(res.error || "فشل الحفظ", true);
      if(saveBtn){saveBtn.disabled = false; saveBtn.textContent = "💾";}
    }
  }).catch(function(err){
    console.error(err);
    showToast("فشل الاتصال بالسيرفر", true);
    if(saveBtn){saveBtn.disabled = false; saveBtn.textContent = "💾";}
  });
}

function saveAllDirty(){
  if(Object.keys(dirtySales).length === 0){
    showToast("لا توجد تغييرات للحفظ", false, true);
    return;
  }
  
  var dateVal = $("filterDate").value;
  var salesArray = [];
  for(var empId in dirtySales){
    salesArray.push({empId: empId, amount: dirtySales[empId]});
  }
  
  var btn = $("saveAllBtn");
  btn.disabled = true;
  btn.textContent = "⏳ جاري الحفظ...";
  
  apiAdminCall("bulkSaveSales", {
    date: dateVal,
    salesJSON: JSON.stringify(salesArray)
  }).then(function(res){
    if(res.success){
      showToast("✅ " + res.message);
      dirtySales = {};
      setTimeout(loadEmployees, 500);
    } else {
      showToast(res.error || "فشل الحفظ", true);
      btn.disabled = false;
      updateSaveAllButton();
    }
  }).catch(function(err){
    console.error(err);
    showToast("فشل الاتصال بالسيرفر", true);
    btn.disabled = false;
    updateSaveAllButton();
  });
}

// ============ إدارة الموظفين ============
function addNewEmployee(){
  var id = $("newEmpId").value.trim();
  var name = $("newEmpName").value.trim();
  var pass = $("newEmpPass").value.trim();
  
  if(!id || !name || !pass){
    showToast("جميع الحقول مطلوبة", true);
    return;
  }
  
  var btn = $("addEmpBtn");
  btn.disabled = true;
  var originalHTML = btn.innerHTML;
  btn.innerHTML = '<span>جاري الإضافة...</span>';
  
  apiAdminCall("addEmployee", {empId: id, empName: name, empPassword: pass}).then(function(res){
    if(res.success){
      showToast("✅ " + res.message);
      $("newEmpId").value = "";
      $("newEmpName").value = "";
      $("newEmpPass").value = "";
      loadEmployees();
    } else {
      showToast(res.error || "فشل الإضافة", true);
    }
  }).catch(function(err){
    console.error(err);
    showToast("فشل الاتصال بالسيرفر", true);
  }).finally(function(){
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  });
}

function toggleStatus(id, currentStatus){
  var newStatus = currentStatus === "active" ? "inactive" : "active";
  var action = currentStatus === "active" ? "إيقاف" : "تنشيط";
  
  if(!confirm("هل تريد " + action + " هذا الموظف؟")) return;
  
  var emp = currentEmployees.find(function(e){return e.id === id});
  var empName = emp ? emp.name : "";
  
  apiAdminCall("updateEmployee", {empId: id, empStatus: newStatus, empName: empName}).then(function(res){
    if(res.success){
      showToast("✅ تم " + action + " الموظف");
      loadEmployees();
    } else {
      showToast(res.error || "فشل التحديث", true);
    }
  }).catch(function(err){
    console.error(err);
    showToast("فشل الاتصال بالسيرفر", true);
  });
}

function resetPassword(id, name){
  var newPass = prompt("أدخل كلمة المرور الجديدة للموظف " + name + ":");
  if(!newPass || newPass.trim() === "") return;
  if(newPass.trim().length < 4){
    showToast("كلمة المرور قصيرة جداً (4 أحرف على الأقل)", true);
    return;
  }
  
  apiAdminCall("updateEmployee", {empId: id, empName: name, empPassword: newPass.trim(), empStatus: "active"}).then(function(res){
    if(res.success){
      showToast("✅ تم تغيير كلمة المرور");
    } else {
      showToast(res.error || "فشل التغيير", true);
    }
  }).catch(function(err){
    console.error(err);
    showToast("فشل الاتصال بالسيرفر", true);
  });
}

function saveTarget(){
  var empId = $("targetEmpId").value;
  var month = $("targetMonth").value;
  var amount = $("targetAmount").value;
  
  if(!empId || !month || !amount){
    showToast("أكمل جميع الحقول", true);
    return;
  }
  
  var btn = $("saveTargetBtn");
  btn.disabled = true;
  var originalHTML = btn.innerHTML;
  btn.innerHTML = '<span>جاري الحفظ...</span>';
  
  apiAdminCall("setTarget", {empId: empId, month: month, target: amount}).then(function(res){
    if(res.success){
      showToast("✅ تم حفظ الهدف");
      $("targetAmount").value = "";
      loadEmployees();
    } else {
      showToast(res.error || "فشل الحفظ", true);
    }
  }).catch(function(err){
    console.error(err);
    showToast("فشل الاتصال بالسيرفر", true);
  }).finally(function(){
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  });
}
</script>
